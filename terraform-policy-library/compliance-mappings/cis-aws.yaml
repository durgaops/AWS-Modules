framework: CIS-AWS-1.4
mappings:
  - control_id: "1.4"
    title: "Ensure no root account access key exists"
    policies:
      - checkov: CKV_AWS_21
      - config_rule: ROOT_ACCOUNT_MFA_ENABLED
  - control_id: "2.1.1"
    title: "Ensure S3 bucket encryption is enabled"
    policies:
      - checkov: CKV_AWS_19
      - conftest: terraform.security
      - cfn_guard: s3_encryption_enabled
  - control_id: "3.1"
    title: "Ensure CloudTrail is enabled in all regions"
    policies:
      - config_rule: MULTI_REGION_CLOUD_TRAIL_ENABLED
      - module: security/cloudtrail-organization
